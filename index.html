  <body>
    <h1>Spicy Ramen</h1>
    <p>Spicy ramen with smoked meat</p>
    <h2>Ingredients</h2>
    <ul>
      <li><em>Ramen dough</em></li>
      <li><em>Vegetables</em></li>
      <li><em>Souse</em></li>
      <li><em>Smoked meat</em></li>
    </ul>
    <h2>Instructions</h2>
    <ol>
      <li>Boil water in a pot</li>
      <li>Add ramen noodles and cook for 3 minutes</li>
      <li>Add vegetables and smoked meat</li>
      <li>Season with spicy sauce and serve hot</li>
    </ol>
